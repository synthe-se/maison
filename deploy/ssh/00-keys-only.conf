# Keys only. Alpine's sshd is musl without PAM: with passwords on, an account whose shadow field
# is "*" (root here) accepted any password over 256 characters (sshhole.com, 2026-11).
# Included before the rest of sshd_config, so these values win.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
