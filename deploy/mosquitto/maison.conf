# Host-native Mosquitto config for maison on Raspberry Pi

# Plaintext listener for debugging on the Pi itself only: nothing on the LAN may read or
# publish the plugs' traffic without TLS.
listener 1883 127.0.0.1

# TLS listener required by Meross devices (IPv4: the plugs speak nothing else). Their firmware
# cannot be assumed to do client certificates nor passwords, so the broker stays anonymous;
# the kernel lets only the plugs reach this port (deploy/openrc/maison-mqtt-firewall, the
# addresses from meross-devices.json, written at every deploy). Maison itself drives them
# over HTTP: the broker is only there for their boot.
listener 8883 0.0.0.0
cafile /etc/mosquitto/certs/maison/ca.pem
certfile /etc/mosquitto/certs/maison/server.pem
keyfile /etc/mosquitto/certs/maison/server-key.pem

allow_anonymous true

log_dest file /var/log/mosquitto/mosquitto.log
log_type warning
log_type error
