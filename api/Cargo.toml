[package]
name = "maison-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "What Maison's HTTP API answers and reads, said once: the backend serves these types, the wall frame's native interface reads them"
publish = false

[dependencies]
# time: instants, civil dates, the house's zone. tzdb-bundle-always: the box and the frame
# carry no /usr/share/zoneinfo, the database comes in the binary
jiff = { version = "1.0.2", features = ["serde", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
