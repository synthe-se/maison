[package]
name = "maison-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
default-run = "maison-backend"
# never on crates.io: cargo deny reads it as private (its path dependency, its unchosen license)
publish = false

[features]
default = ["bluetooth"]
bluetooth = ["dep:btleplug"]
live-runtime-tests = []

[dependencies]
# what the API answers and reads, shared with the wall frame's native interface (frame/ui)
maison-api = { path = "../api" }
# passkeys (docs/passkeys.md): usernameless sign-in needs `conditional-ui`
webauthn-rs = { version = "0.5.5", default-features = false, features = ["conditional-ui"] }
webauthn-rs-proto = "0.5.5"   # the same version webauthn-rs pins; for the options it builds
# webauthn-rs-core links OpenSSL: built from source, so the static musl binary for the Pi
# carries it (cargo-zigbuild compiles it with zig cc)
openssl = { version = "=0.10.81", features = ["vendored"] }
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
btleplug = { version = "0.13.5", optional = true }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
dotenvy = "0.15.7"
# The uplg forks track upstream (PaulmannLighting) plus robustness fixes and
# the EZSP <= v13 legacy importTransientKey wire format for the MG21 dongle.
# ashv2's `ezsp` feature provides the Transmit/Receive adapters; the ezsp
# crate itself resolves through [patch.crates-io] below so both the direct
# dependency and ashv2's internal one use the same patched source.
# the uplg forks (main = upstream + our fixes), pinned: `cargo update` must not follow a branch
ashv2 = { git = "https://github.com/uplg/ashv2/", rev = "a6ab7043d7bc9924114ae22fc0abf73298645d7e", version = "13.0.0", features = ["ezsp"] }
ezsp = "17.0.0"
silizium = { version = "=3.1.0", features = ["le-stream"] }
futures = "0.3.34"
heapless = "=0.9.3"
# HS256 only, through our own provider (auth.rs `hs256`): no crypto backend feature, so no
# RSA/ECDSA/EdDSA (and no rsa 0.9, RUSTSEC-2023-0071) in the tree for a JWT we HMAC
jsonwebtoken = { version = "=11.1.0", default-features = false }
md5 = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "form"] }
rbroadlink = "0.4.2"
# ADB (Android TV box): the device authenticates the client by having it sign
# a 20-byte token with RSA-2048, so a pure-Rust RSA is needed to speak the
# protocol without shipping the adb binary to the Pi.
# Android TV Remote v2: mutual TLS with a self-signed client certificate we
# generate ourselves, and the pairing secret is a SHA-256 over both public
# keys — hence rcgen to mint the cert and x509-parser to read the TV's.
# rustls/tokio-rustls are already in the tree via reqwest.
rcgen = "0.14.10"
rustls = "0.23.46"
tokio-rustls = "0.26.6"
x509-parser = "0.18.1"
sha2 = "0.11.1"
rsa = "0.10.0-rc.19"
sha1 = { version = "0.11.0", features = ["oid"] }
rand = "0.10.3"
rust-async-tuyapi = { git = "https://github.com/uplg/rust-async-tuyapi", rev = "6cd9180b296a04ef9e6751b594c6235aa79b7157" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-serial = "5.5.0"
tower-http = { version = "0.7.1", features = ["cors", "fs", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["v4"] }
# Matter controller (Sonoff Orb-RBS shutter switch): commissioning over IP,
# CASE sessions and the Interaction Model in pure Rust, on the ring already in
# the tree. matter-codec supplies the TLV tags for command fields.
matter-controller = "0.18.2"
matter-codec = "0.3.2"
sunrise = "3.0.0"

[dev-dependencies]
# paused time in tests (the Tuya worker lifecycle)
tokio = { version = "1.53.3", features = ["test-util"] }
# a software authenticator and client: passkeys end to end, discoverable ones included
passkey = { version = "0.6.0", features = ["rust-crypto"] }
async-trait = "=0.1.92"
public-suffix = "=0.1.3"
tempfile = "3.27.0"
tower = "0.5.3"

[patch.crates-io]
ezsp = { git = "https://github.com/uplg/ezsp", rev = "edec778da0e65934976913b9f6ef1663367bfac3" }
