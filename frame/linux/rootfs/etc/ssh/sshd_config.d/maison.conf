# SSH: root by key only (installed at build: rootfs.sh), no
# password anywhere (root's is locked), the host keys kept on userdata (generated on the frame
# once by maison-ssh-keys.service: the same at every boot, never in the image).
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
HostKey /android-data/maison/ssh/ssh_host_ed25519_key
