# The frame has no battery and its system lives in RAM: timesyncd's clock file (its last
# synchronised time, which it sets the clock from as it starts) is kept on userdata, so a power
# cut brings the clock back to minutes ago, not to the system's build day (TLS refuses that).
# The directory comes from maison-timesync.service: BindPaths wants it before ExecStartPre runs,
# and tmpfiles refuses a path through Android's /android-data (owned by its uid 1000).
[Unit]
Requires=maison-timesync.service
After=maison-timesync.service

[Service]
BindPaths=/android-data/maison/timesync:/var/lib/systemd/timesync
