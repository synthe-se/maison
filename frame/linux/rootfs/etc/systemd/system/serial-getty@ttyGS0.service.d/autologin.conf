# The USB-C console (the initramfs's CDC ACM gadget): root, logged in at once, for bring-up only.
# It runs only while a debug-console file exists: root's /android-data/maison/debug-console, or
# /android-data/local/tmp/maison/debug-console, which try.sh writes from Android over ADB (whoever
# holds the ADB key can already replace the system there: no more power). `rm` both once the
# frame is on the wall: without them there is no console at all, and root has no password to type
# (locked by rootfs.sh), so whoever holds the frame and a cable gets nothing.
[Unit]
RequiresMountsFor=/android-data
ConditionPathExists=|/android-data/maison/debug-console
ConditionPathExists=|/android-data/local/tmp/maison/debug-console

# Without a host on the USB-C (the frame on its own power, on the wall) /dev/ttyGS0 never opens:
# systemd must not open it (StandardInput=tty did, in the unit's child, while holding the lock on
# /dev/console, and PID 1 then waited on that lock for ever: nothing else started, the app
# neither). agetty opens it itself, non-blocking, a local line (-L: no carrier waited for).
[Service]
StandardInput=null
StandardOutput=null
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --local-line --keep-baud 115200 %I $TERM
