# The USB-C console (the initramfs's CDC ACM gadget): root, logged in at once, for bring-up only.
# It runs only while /android-data/maison/debug-console exists (the bring-up scripts create it,
# `rm` it once the frame is on the wall): without it there is no console at all, and root has
# no password to type (locked by rootfs.sh), so whoever holds the frame and a cable gets nothing.
[Unit]
RequiresMountsFor=/android-data
ConditionPathExists=/android-data/maison/debug-console

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200 %I $TERM
