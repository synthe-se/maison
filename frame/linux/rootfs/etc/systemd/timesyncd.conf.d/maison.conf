# Named here: Buildroot's timesyncd is built without servers, and a frame without NTP drifts until
# TLS refuses its clock. No battery: its time comes from here and from the file on userdata.
[Time]
NTP=0.fr.pool.ntp.org 1.fr.pool.ntp.org 2.fr.pool.ntp.org 3.fr.pool.ntp.org
FallbackNTP=time.cloudflare.com
