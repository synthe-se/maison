[package]
name = "maison-frame-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "The frame's updates and first setup: maison-update, maison-setup; maison-sign on the build machine"
publish = false

[dependencies]
# Ed25519 and SHA-256, the same ring the app's TLS is built on
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# HTTPS without an async runtime: rustls and the webpki roots
ureq = "3.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
