[package]
name = "maison-frame-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Maison's own on the frame: maison-setup, the page of the frame's own Wi-Fi. The frame's tools (its updates, its Wi-Fi's service, its power key) are frame-kernel's"
publish = false

[dependencies]
# the frame's Wi-Fi: where its network is kept and what a name and a password may be, said once
# (synthe-se/frame-kernel, checked out beside this repository)
frame-tools = { path = "../../../frame-kernel/tools" }
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
