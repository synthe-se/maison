# Maison on the frame (synthe-se/frame-kernel, README « A product »): the wall screen's image is
# built there, `just image <this directory>`, from what this directory says.
NAME=maison
TITLE=Maison
HOST=maison-frame
# the unit a boot is judged on, and the file its interface touches while it draws
UNIT=maison-ui.service
HEARTBEAT=/run/maison-ui/heartbeat
# the boot picture: the frame stands in portrait, its panel mounted upside down; Maison's mark on
# the app's ground, the ring in its accent (web/src/styles/tokens.css: cloud, petrol)
TURN=180
GROUND=#f2f0ea
INK=#0e5e68
MARK=../../web/static/brand.svg
MARK_HEIGHT=240
UPDATE_URL=https://updates.synthe.se/frame
# what the interface links, built before it
BUILDROOT_FIRST="libdrm mesa3d systemd"
