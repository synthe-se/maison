# cargo deny check: what the frame's app may depend on. No GPL of any version (the owner's
# rule), crates from crates.io only, advisories from RustSec.

[graph]
targets = ["armv7-unknown-linux-gnueabihf", "aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# the repository's own crates (publish = false): no license chosen yet, the owner's to choose
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
