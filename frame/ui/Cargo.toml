[package]
name = "maison-frame-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Maison on the wall frame, drawn natively (SDL3, GLES 2 under cage): no WebView"
publish = false

[dependencies]
# what the API answers and reads, the backend's own types
maison-api = { path = "../../api" }
# SDL from its latest sources, linked in (trixie's libSDL3 is older: never loaded in its place);
# SDL itself opens the system's Wayland, EGL and GLES libraries at run time
sdl3 = { version = "0.20.0", features = ["build-from-source-static", "ttf"] }
# SDL_ttf from its sources with its own FreeType, HarfBuzz and PlutoSVG, linked in: nothing of
# the system's text stack (the feature reaches sdl3's own dependency, `^0.7.1`, the same crate).
# `=`: a sys crate's version carries the C library it vendors (`0.7.1+SDL-ttf-3.2.2`), so the
# SDL_ttf linked in changes only when chosen here, never by a `cargo update`
sdl3-ttf-sys = { version = "=0.7.1", features = ["build-static-vendored"] }
# HTTP without an async runtime: rustls (ring) and the webpki roots, gzip
ureq = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# the house's clock (Tempo's hours, the shutters' times): maison_api's HOUSE_TZ and its Tz
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# the web app's icons (lucide SVG) and the anti-aliased shapes, rasterised once into textures
resvg = { version = "0.49.0", default-features = false }

# the family's photos read off the drawing thread: JPEG in pure Rust, nothing of the system's
zune-jpeg = "0.5.15"
zune-core = "0.5.3"

[build-dependencies]
# the web app's WOFF2 fonts into TrueType, its variable faces instanced at the weights the type
# scale draws (SDL_ttf has no variation API); pure Rust, no zlib
allsorts = { version = "0.17.0", default-features = false, features = ["flate2_rust"] }
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
